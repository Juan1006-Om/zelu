<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>zelu — app</title>
  <meta name="theme-color" content="#3a4bf3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="zelu">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="zelu.css?v=10">
  <style>
    html,body{height:100%;overflow:hidden;background:#F4F5FA}
    body{display:flex;align-items:center;justify-content:center}
    .app-shell{width:100%;height:100dvh;position:relative}
    .app-shell #app{border-radius:0}
    .in{font-size:16px}
    .back-site{position:fixed;z-index:60;display:inline-flex;align-items:center;gap:6px;left:12px;bottom:calc(96px + env(safe-area-inset-bottom));
      padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#3a4bf3;font:800 13px Nunito,sans-serif;
      box-shadow:0 6px 18px rgba(16,19,43,.15)}

    @media (max-width:599px){
      #app .sb{display:none}
      .app-shell .scr:not(.full){padding-top:calc(18px + env(safe-area-inset-top))}
      .app-shell .splash{padding-top:calc(90px + env(safe-area-inset-top))}
      .app-shell .bn{height:calc(82px + env(safe-area-inset-bottom));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
      .app-shell .cbar{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
    }

    @media (min-width:600px){
      body{background:#ffffff}
      body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none}
      body::before{width:520px;height:520px;left:-120px;top:-120px;background:rgba(58,75,243,.22)}
      body::after{width:560px;height:560px;right:-140px;bottom:-140px;background:rgba(129,2,207,.2)}
      .app-shell{width:390px;height:min(820px,94dvh);border-radius:54px;padding:12px;background:#0d0d0f;box-shadow:0 0 0 2px #333,0 40px 80px rgba(58,75,243,.3);z-index:1}
      .app-shell #app{border-radius:42px}
      .back-site{top:24px;left:24px;bottom:auto}
    }
  </style>
</head>
<body>
  <a href="./" class="back-site">← Voltar ao site</a>
  <div class="app-shell"><div id="app"></div></div>

  <script src="app.js?v=10"></script>
  <script>
    if (typeof render !== 'function') {
      document.getElementById('app').innerHTML =
        '<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font:600 14px Nunito,sans-serif;color:#5f6278">' +
        'Não foi possível abrir o app.<br><br><small>O arquivo app.js não carregou.</small></div>';
    }
  </script>
</body>
</html>
