<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>zelu — app</title>
  <meta name="theme-color" content="#7A06D6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="zelu">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html,body{height:100%;overflow:hidden;background:#0d0d0f}
    body{display:flex;align-items:center;justify-content:center}
    .app-shell{width:100%;height:100dvh;position:relative}
    .app-shell #app{border-radius:0}
    .in{font-size:16px}
    .back-site{display:none}

    /* CELULAR: tela cheia, usa a barra de status real do aparelho */
    @media (max-width:599px){
      #app .sb{display:none}
      .app-shell .scr:not(.full){padding-top:calc(18px + env(safe-area-inset-top))}
      .app-shell .splash{padding-top:calc(90px + env(safe-area-inset-top))}
      .app-shell .bn{height:calc(82px + env(safe-area-inset-bottom));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
      .app-shell .cbar{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
    }

    /* COMPUTADOR: moldura de celular centralizada */
    @media (min-width:600px){
      body{background:radial-gradient(circle at 50% 30%,#1b2a6b 0%,#0d0d0f 60%)}
      .app-shell{width:390px;height:min(820px,94dvh);border-radius:54px;padding:12px;background:#0d0d0f;box-shadow:0 0 0 2px #333,0 40px 80px rgba(31,75,242,.35)}
      .app-shell #app{border-radius:42px}
      .back-site{display:inline-flex;position:fixed;top:24px;left:24px;color:#fff;font-weight:700;opacity:.8;gap:8px;align-items:center}
      .back-site:hover{opacity:1}
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-site">← Voltar ao site</a>
  <div class="app-shell"><div id="app"></div></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
